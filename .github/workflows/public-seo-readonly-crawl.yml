# Public comerent.net audit: manual dispatch or controlled GitHub request file push.
# No KPanel session, booking API, credentials or production mutations.
name: Come Rent Public SEO READ-ONLY Audit

on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: 'default = existing bounded sample; 0, 1, ... = deterministic sitemap batch'
        type: string
        default: 'default'
        required: false
  push:
    branches:
      - main
    paths:
      - 'audit/triggers/public-seo-request.json'

permissions:
  contents: read

concurrency:
  group: comerent-public-seo-readonly-crawl
  cancel-in-progress: false

jobs:
  public-seo-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run offline security and regression tests
        run: npm test

      - name: Validate selected sitemap batch (offline)
        id: selected_batch
        shell: bash
        env:
          REQUESTED_BATCH_INDEX: ${{ inputs.batch_index }}
        run: node tools/public-seo-workflow-batch.mjs

      - name: Audit public Come Rent pages (GET only, rate limited)
        shell: bash
        env:
          BATCH_INDEX: ${{ steps.selected_batch.outputs.batch_index }}
        run: |
          if [ "$BATCH_INDEX" = "default" ]; then
            node tools/public-seo-crawler.mjs --live
          else
            node tools/public-seo-crawler.mjs --live "--batch-index=$BATCH_INDEX"
          fi

      - name: Save sanitized audit summary
        uses: actions/upload-artifact@v4
        with:
          name: public-seo-readonly-audit-${{ github.run_id }}
          path: |
            audit/reports/master-audit.json
            audit/reports/master-audit.md
          if-no-files-found: error
          retention-days: 7
